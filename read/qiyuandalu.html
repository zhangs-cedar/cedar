<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="吞噬星空2 · 起源大陆 — 纯文本阅读。" />
    <title>吞噬星空2 · 起源大陆 · cedar</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="viz-page read-page">
    <a class="skip" href="#read">跳到正文</a>
    <div class="wrap--chart">
      <header class="viz-top read-head">
        <a class="viz-back" href="../index.html" aria-label="返回 cedar 首页">‹ cedar</a>
        <h1 class="viz-title">吞噬星空2 · 起源大陆</h1>
        <p class="viz-note">
          纯文本阅读；正文在首屏后从同目录 <code>qiyuandalu.txt</code> 加载。顶部可展开<strong>章节目录</strong>；地址栏使用
          <code>#ch-章节号</code> 可直达该章并收藏链接。
        </p>
        <details id="read-toc" class="read-toc" hidden>
          <summary class="read-toc-summary">
            章节目录
            <span class="read-toc-meta">（共 <span id="read-toc-count" class="read-toc-count">0</span> 章）</span>
          </summary>
          <div class="read-toc-panel">
            <nav id="read-toc-list" class="read-toc-list" aria-label="章节目录"></nav>
          </div>
        </details>
      </header>
      <p id="read-status" class="read-status" role="status">正在加载全文…</p>
      <p id="read-error" class="read-error" hidden></p>
      <article id="read" class="read-prose" aria-label="小说正文" tabindex="-1" hidden>
        <div id="read-body" class="read-body"></div>
      </article>
      <p class="read-foot">
        <a class="read-top" href="#read">回正文顶部</a>
      </p>
    </div>
    <script>
      (function () {
        var status = document.getElementById("read-status");
        var err = document.getElementById("read-error");
        var article = document.getElementById("read");
        var body = document.getElementById("read-body");
        var tocRoot = document.getElementById("read-toc");
        var tocList = document.getElementById("read-toc-list");
        var tocCount = document.getElementById("read-toc-count");

        if (!status || !err || !article || !body || !tocRoot || !tocList || !tocCount) return;

        var chapterRe = /^第(\d+)章[）\)]?[\s\u3000]*(.*)$/;
        var maxChapter = 0;

        function parseTextToBody(text) {
          body.textContent = "";
          maxChapter = 0;
          var norm = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
          var lines = norm.split("\n");
          var frag = document.createDocumentFragment();
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            var m = line.match(chapterRe);
            if (m) {
              var n = m[1];
              var h = document.createElement("h2");
              h.className = "read-chapter";
              h.id = "ch-" + n;
              h.textContent = line.trim();
              frag.appendChild(h);
              var cn = parseInt(n, 10);
              if (cn > maxChapter) maxChapter = cn;
            } else if (line.trim() !== "") {
              var p = document.createElement("p");
              p.className = "read-para";
              p.textContent = line;
              frag.appendChild(p);
            }
          }
          body.appendChild(frag);
          if (maxChapter < 1) {
            var heads = body.querySelectorAll(".read-chapter");
            heads.forEach(function (el) {
              var idn = parseInt(String(el.id || "").replace(/^ch-/, ""), 10);
              if (!isNaN(idn) && idn > maxChapter) maxChapter = idn;
            });
          }
          fillToc();
        }

        function fillToc() {
          tocList.textContent = "";
          var heads = body.querySelectorAll(".read-chapter");
          tocCount.textContent = String(heads.length);
          var frag = document.createDocumentFragment();
          for (var i = 0; i < heads.length; i++) {
            var h = heads[i];
            var id = h.id || "";
            if (!id || id.indexOf("ch-") !== 0) continue;
            var a = document.createElement("a");
            a.className = "read-toc-link";
            a.href = "#" + id;
            a.textContent = h.textContent.trim();
            frag.appendChild(a);
          }
          tocList.appendChild(frag);
        }

        function wireToc() {
          tocList.addEventListener("click", function (e) {
            var t = e.target;
            var a = null;
            if (t && t.closest) a = t.closest("a");
            else if (t && t.nodeType === 3 && t.parentElement && t.parentElement.closest) a = t.parentElement.closest("a");
            if (!a || !a.getAttribute("href")) return;
            var href = a.getAttribute("href") || "";
            var m = /^#ch-(\d+)$/.exec(href);
            if (!m) return;
            e.preventDefault();
            var n = parseInt(m[1], 10);
            if (isNaN(n)) return;
            scrollToChapter(n, true);
            try {
              tocRoot.open = false;
            } catch (err) {}
          });
        }

        function chapterExists(n) {
          return !!document.getElementById("ch-" + n);
        }

        function scrollToChapter(n, smooth) {
          var el = document.getElementById("ch-" + n);
          if (!el) return false;
          el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
          try {
            history.replaceState(null, "", "#ch-" + n);
          } catch (e) {
            location.hash = "#ch-" + n;
          }
          return true;
        }

        function hashChapter() {
          var h = location.hash || "";
          var m = /^#ch-(\d+)$/.exec(h);
          if (!m) return null;
          var n = parseInt(m[1], 10);
          return isNaN(n) ? null : n;
        }

        function applyInitialScroll() {
          var hc = hashChapter();
          if (hc != null && chapterExists(hc)) {
            requestAnimationFrame(function () {
              scrollToChapter(hc, false);
            });
            return;
          }
          if (location.hash === "#read") {
            requestAnimationFrame(function () {
              article.focus({ preventScroll: true });
              article.scrollIntoView({ block: "start" });
            });
          }
        }

        fetch("qiyuandalu.txt", { cache: "force-cache" })
          .then(function (r) {
            if (!r.ok) throw new Error("load");
            return r.text();
          })
          .then(function (text) {
            parseTextToBody(text);
            status.hidden = true;
            article.hidden = false;
            tocRoot.hidden = false;
            wireToc();
            applyInitialScroll();
          })
          .catch(function () {
            status.hidden = true;
            err.hidden = false;
            err.textContent =
              "无法加载 qiyuandalu.txt。若本地直接打开本 HTML 文件，浏览器会限制跨源请求，请通过 cedar 的站点或本地静态服务器打开。";
          });

        window.addEventListener("hashchange", function () {
          var hc = hashChapter();
          if (hc != null && chapterExists(hc)) scrollToChapter(hc, false);
        });
      })();
    </script>
  </body>
</html>
